# Pushing a tag like v0.1.0 builds the download and publishes it.
#
# The build has to happen here rather than on someone's desk: a plugin folder assembled by hand
# is a plugin folder whose provenance nobody can check, and these are binaries that strangers
# are being asked to unzip into their reloading software. Every release asset on the page came
# from a tagged commit in this repo, built by this file, and the notes carry each zip's
# SHA-256 so anyone who cares can prove their download matches.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Full history, so the annotated tag's own message is available for the release notes.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The tag and the version in Directory.Build.props are two claims about the same thing,
      # and the manifest GRT reads is stamped from the second. If they disagree, the plugin
      # would report one version while the download page announced another — so stop here
      # instead, with the two values named.
      - name: Check the tag against the shipped version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $want = $tag.TrimStart('v')
          $got = ([xml](Get-Content Directory.Build.props -Raw)).SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($got -ne $want) {
            throw "tag $tag means version $want, but Directory.Build.props says $got. Bump one of them."
          }

      # Two downloads, one build each, from the same tagged commit.
      #
      # The self-contained zip is the one to hand a stranger: it needs nothing installed. It is
      # also about 155 MB unpacked, almost all of which is .NET rather than this plugin — and 45 MB
      # of that is WPF, a UI toolkit nothing here touches, which comes along because .NET ships
      # WinForms and WPF as a single runtime pack with no supported way to take only one half.
      # Trimming is not the answer: it is unsupported for WinForms, and GRT loads plugins by
      # reflection, which is exactly what a trimmer cannot follow. So the slim zip is simply the
      # same plugin without the bundled runtime — a dozen files — for the many GRT machines that
      # already have the .NET 8 Desktop Runtime.
      #
      # Each is zipped from the parent so it unpacks as ShotMarker\, which is the folder name GRT
      # wants inside plugins\ — unzipping a bare pile of DLLs into plugins\ does not make a plugin.
      - name: Build and zip both downloads
        id: zip
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          # build-plugin.ps1 wipes dist\ShotMarker on every run, so the second build cannot
          # inherit a file from the first — which for these two variants would be a 68 MB
          # runtime in a zip that advertises itself as not carrying one.
          function Pack($name, $prefix) {
            Compress-Archive -Path dist/ShotMarker -DestinationPath $name
            $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            $mb  = '{0:N1}' -f ((Get-Item $name).Length / 1MB)
            "${prefix}zip=$name" >> $env:GITHUB_OUTPUT
            "${prefix}sha=$sha"  >> $env:GITHUB_OUTPUT
            "${prefix}mb=$mb"    >> $env:GITHUB_OUTPUT
            Write-Host "==> $name ($mb MB)"
          }
          ./tools/build-plugin.ps1 -SelfContained
          Pack "GRT-ShotMarker-$tag-win-x64.zip" ''
          ./tools/build-plugin.ps1
          Pack "GRT-ShotMarker-$tag-win-x64-needs-dotnet8.zip" 'slim_'

      # The notes body lives in .github/release-notes.md, not in a string in here: a release page
      # is read by people deciding whether to trust a 68 MB download, and prose is easier to get
      # right in a markdown file than inside YAML inside PowerShell. Only the facts about the file
      # just built are substituted in. What changed in a release is written by hand in that same
      # file, not pulled out of the tag — two attempts to read it from the tag produced two
      # different wrong answers, because `git tag --format=%(contents)` gives the tagged commit's
      # message rather than the tag's own whenever the ref reaches the runner lightweight, and
      # %(contents:body) silently drops the first line even when it does not.
      - name: Write the release notes
        shell: pwsh
        run: |
          # Both ends of the encoding are explicit: the default differs between PowerShell
          # versions, and this text has em dashes in it.
          # SLIM_ before the shorter tokens: a plain .Replace('{{ZIP}}', ...) run first would
          # also eat the ZIP in {{SLIM_ZIP}} and leave a stray "SLIM_" in front of a filename.
          $notes = (Get-Content .github/release-notes.md -Raw -Encoding utf8).
                     Replace('{{SLIM_ZIP}}', '${{ steps.zip.outputs.slim_zip }}').
                     Replace('{{SLIM_SHA}}', '${{ steps.zip.outputs.slim_sha }}').
                     Replace('{{SLIM_MB}}',  '${{ steps.zip.outputs.slim_mb }}').
                     Replace('{{ZIP}}', '${{ steps.zip.outputs.zip }}').
                     Replace('{{SHA}}', '${{ steps.zip.outputs.sha }}').
                     Replace('{{MB}}',  '${{ steps.zip.outputs.mb }}')
          if ($notes -match '\{\{\w+\}\}') { throw "unfilled placeholder in the release notes: $($Matches[0])" }
          [System.IO.File]::WriteAllText("$PWD/notes.md", $notes, (New-Object System.Text.UTF8Encoding $false))
          Get-Content notes.md

      # Updates an existing release rather than failing on one. A run can publish and then fail
      # afterwards, or be cancelled too late to stop it, and then the natural next move is to
      # re-run — which `gh release create` refuses, because the release it would create is
      # already there.
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag   = '${{ github.ref_name }}'
          $zips  = @('${{ steps.zip.outputs.zip }}', '${{ steps.zip.outputs.slim_zip }}')
          $title = "ShotMarker Import $tag"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "==> $tag exists; updating it"
            gh release edit   $tag --title $title --notes-file notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
            gh release upload $tag $zips --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          } else {
            gh release create $tag $zips --title $title --notes-file notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
