# Pushing a tag like v0.1.0 builds the download and publishes it.
#
# The build has to happen here rather than on someone's desk: a plugin folder assembled by hand
# is a plugin folder whose provenance nobody can check, and this one is a 70-odd MB binary that
# strangers are being asked to unzip into their reloading software. Every release asset on the
# page came from a tagged commit in this repo, built by this file, and the notes carry the
# zip's SHA-256 so anyone who cares can prove the download matches.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Full history, so the annotated tag's own message is available for the release notes.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The tag and the version in Directory.Build.props are two claims about the same thing,
      # and the manifest GRT reads is stamped from the second. If they disagree, the plugin
      # would report one version while the download page announced another — so stop here
      # instead, with the two values named.
      - name: Check the tag against the shipped version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $want = $tag.TrimStart('v')
          $got = ([xml](Get-Content Directory.Build.props -Raw)).SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($got -ne $want) {
            throw "tag $tag means version $want, but Directory.Build.props says $got. Bump one of them."
          }

      # Self-contained: the download works on a machine with no .NET installed at all.
      - name: Build the plugin folder
        shell: pwsh
        run: ./tools/build-plugin.ps1 -SelfContained

      # Zipped from the parent so it unpacks as ShotMarker\, which is the folder name GRT wants
      # inside plugins\ — unzipping a bare pile of DLLs into plugins\ does not make a plugin.
      - name: Zip it
        shell: pwsh
        run: |
          $zip = "GRT-ShotMarker-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path dist/ShotMarker -DestinationPath $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $mb = '{0:N1}' -f ((Get-Item $zip).Length / 1MB)
          "zip=$zip"  >> $env:GITHUB_OUTPUT
          "sha=$sha"  >> $env:GITHUB_OUTPUT
          "mb=$mb"    >> $env:GITHUB_OUTPUT
        id: zip

      # The notes body lives in .github/release-notes.md, not in a string in here: a release page
      # is read by people deciding whether to trust a 68 MB download, and prose is easier to get
      # right in a markdown file than inside YAML inside PowerShell. Only the facts about the file
      # just built are substituted in. What changed in a release is written by hand in that same
      # file, not pulled out of the tag — two attempts to read it from the tag produced two
      # different wrong answers, because `git tag --format=%(contents)` gives the tagged commit's
      # message rather than the tag's own whenever the ref reaches the runner lightweight, and
      # %(contents:body) silently drops the first line even when it does not.
      - name: Write the release notes
        shell: pwsh
        run: |
          # Both ends of the encoding are explicit: the default differs between PowerShell
          # versions, and this text has em dashes in it.
          $notes = (Get-Content .github/release-notes.md -Raw -Encoding utf8).
                     Replace('{{ZIP}}', '${{ steps.zip.outputs.zip }}').
                     Replace('{{SHA}}', '${{ steps.zip.outputs.sha }}').
                     Replace('{{MB}}',  '${{ steps.zip.outputs.mb }}')
          if ($notes -match '\{\{\w+\}\}') { throw "unfilled placeholder in the release notes: $($Matches[0])" }
          [System.IO.File]::WriteAllText("$PWD/notes.md", $notes, (New-Object System.Text.UTF8Encoding $false))
          Get-Content notes.md

      # Updates an existing release rather than failing on one. A run can publish and then fail
      # afterwards, or be cancelled too late to stop it, and then the natural next move is to
      # re-run — which `gh release create` refuses, because the release it would create is
      # already there.
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag   = '${{ github.ref_name }}'
          $zip   = '${{ steps.zip.outputs.zip }}'
          $title = "ShotMarker Import $tag"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "==> $tag exists; updating it"
            gh release edit   $tag --title $title --notes-file notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          } else {
            gh release create $tag $zip --title $title --notes-file notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
